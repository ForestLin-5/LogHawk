{{- if .Values.logCollector.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  namespace: {{ $.Values.global.namespace }}
spec:
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
      labels:
        app: log-collector
    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      containers:
        - name: collector
          image: {{ .Values.logCollector.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: INGEST_URL
              value: "http://ingest.{{ $.Values.global.namespace }}:8001/ingest"
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30          resources:
            {{- toYaml .Values.logCollector.resources | nindent 12 }}
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
{{- end }}
