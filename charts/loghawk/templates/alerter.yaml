{{- if .Values.alerter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: alerter
  namespace: {{ $.Values.global.namespace }}
spec:
  selector:
    app: alerter
  ports:
    - port: 8004
      targetPort: 8004
      name: ws
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerter
  namespace: {{ $.Values.global.namespace }}
spec:
  replicas: {{ .Values.alerter.replicas }}
  selector:
    matchLabels:
      app: alerter
  template:
    metadata:
      labels:
        app: alerter
    spec:
      containers:
        - name: alerter
          image: {{ .Values.alerter.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8004
          resources:
            {{- toYaml .Values.alerter.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
