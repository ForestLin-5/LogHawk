# NOTE: PLACEHOLDER values. Generate strong secrets before production use.
# Recommended: kubectl -n loghawk create secret generic loghawk-secret \
#   --from-literal=POSTGRES_USER=loghawk \
#   --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 16) \
#   --from-literal=RABBITMQ_USER=admin \
#   --from-literal=RABBITMQ_PASS=$(openssl rand -hex 16) \
#   --from-literal=OPENAI_API_KEY=sk-your-real-key
apiVersion: v1
kind: Secret
metadata:
  name: loghawk-secret
  namespace: loghawk
type: Opaque
stringData:
  POSTGRES_USER: "loghawk"
  POSTGRES_PASSWORD: "<CHANGE_ME_POSTGRES_PASSWORD>"
  RABBITMQ_USER: "admin"
  RABBITMQ_PASS: "<CHANGE_ME_RABBITMQ_PASSWORD>"
  OPENAI_API_KEY: "<CHANGE_ME_OPENAI_API_KEY>"
  CHAOS_API_TOKEN: "<CHANGE_ME_CHAOS_API_TOKEN>"
