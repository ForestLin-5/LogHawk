apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: loghawk-high
value: 1000000
globalDefault: false
description: "LogHawk core services - evicted last under memory pressure"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: loghawk-low
value: 100
globalDefault: false
description: "LogHawk auxiliary services - can be evicted first"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alerter-pdb
  namespace: loghawk
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: alerter
---
apiVersion: policy/v1
kind: PodDisruptionBudget
