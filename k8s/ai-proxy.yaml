apiVersion: v1
kind: Secret
metadata:
  name: ai-proxy-secret
  namespace: loghawk
type: Opaque
stringData:
  OPENAI_API_KEY: "<CHANGE_ME_OPENAI_API_KEY>"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4o-mini"
  PATROL_INTERVAL_SEC: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-proxy
  namespace: loghawk
  labels:
    app: ai-proxy
    component: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-proxy
  template:
    metadata:
      labels:
        app: ai-proxy
        component: ai-agent
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ai-proxy
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: aliyun-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ai-proxy
        image: loghawk/ai-proxy:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
          name: http
        envFrom:
        - secretRef:
            name: ai-proxy-secret
        env:
        - name: AI_PROXY_PORT
          value: "8003"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-proxy
  namespace: loghawk
  labels:
    app: ai-proxy
spec:
  selector:
    app: ai-proxy
  ports:
  - port: 8003
    targetPort: 8003
    name: http
  type: ClusterIP
