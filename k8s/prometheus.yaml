apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: loghawk
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: loghawk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.51.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.retention.time=7d
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 30
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      volumes:
      - name: config
        configMap:
          name: prometheus-config
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: loghawk
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\nscrape_configs:\n  - job_name:\
    \ 'loghawk-services'\n    kubernetes_sd_configs:\n      - role: pod\n        namespaces:\n\
    \          names:\n            - loghawk\n    relabel_configs:\n      - source_labels:\
    \ [__meta_kubernetes_pod_label_app]\n        action: keep\n        regex: ingest|ai-proxy|alerter|chaos"
