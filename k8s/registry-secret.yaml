# NOTE: This manifest contains PLACEHOLDER credentials only.
# Before deploying, replace <USERNAME> and <PASSWORD> with your real registry
# credentials, or generate this Secret imperatively:
#
#   kubectl -n loghawk create secret docker-registry aliyun-registry \
#     --docker-server=crpi-kwcxn84zbm6expkn.cn-guangzhou.personal.cr.aliyuncs.com \
#     --docker-username=<USERNAME> --docker-password=<PASSWORD>
#
apiVersion: v1
kind: Secret
metadata:
  name: aliyun-registry
  namespace: loghawk
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "crpi-kwcxn84zbm6expkn.cn-guangzhou.personal.cr.aliyuncs.com": {
          "username": "<CHANGE_ME_USERNAME>",
          "password": "<CHANGE_ME_PASSWORD>",
          "auth": "<CHANGE_ME_BASE64_USERNAME_PASSWORD>"
        }
      }
    }
