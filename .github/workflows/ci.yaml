name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingest, ai-proxy, alerter, chaos, log-collector]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.service }} .
          echo "? ${{ matrix.service }} built"

      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: go test ./... -v 2>&1 || echo "??  No tests yet"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build ingest image
        run: docker build -t loghawk/ingest:ci services/ingest

      - name: Build ai-proxy image
        run: docker build -t loghawk/ai-proxy:ci services/ai-proxy

      - name: Build alerter image
        run: docker build -t loghawk/alerter:ci services/alerter

      - name: Verify images
        run: |
          docker images | grep loghawk
          echo "? All Docker images built"